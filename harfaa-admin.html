here<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harfaa Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:20px;max-width:800px;margin:auto}
input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;box-sizing:border-box}
button{background:#fff;color:#000;padding:12px 20px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
.card{background:#1c1c1c;padding:15px;border-radius:12px;margin:10px 0}
img{width:100%;border-radius:10px}
.hidden{display:none}
label{font-size:13px;color:#aaa}
.size-box label{margin-left:12px;color:#fff;font-size:15px}
.size-box input{width:auto}
</style>
</head>
<body>

<div id="login">
<h2>دخول الادمن - Harfaa</h2>
<input id="email" placeholder="الايميل" value="admin@harfaa.com">
<input id="pass" type="password" placeholder="الباسورد" value="harfaa12345">
<button onclick="login()">دخول</button>
<p id="err" style="color:red"></p>
</div>

<div id="panel" class="hidden">
<h2>لوحة تحكم Harfaa 👕</h2>
<button onclick="logout()" style="background:#333;color:#fff">خروج</button>

<h3>اضافة منتج جديد</h3>
<input id="p_name" placeholder="اسم المنتج - مثال: هودي أوفر سايز">
<input id="p_price" type="number" placeholder="السعر - مثال: 850">
<input id="p_old" type="number" placeholder="السعر قبل الخصم (اختياري)">
<input id="p_image" placeholder="لينك صورة المنتج">

<label>المقاسات</label>
<div class="size-box">
<label><input type="checkbox" value="S" class="size"> S</label>
<label><input type="checkbox" value="M" class="size"> M</label>
<label><input type="checkbox" value="L" class="size"> L</label>
<label><input type="checkbox" value="XL" class="size"> XL</label>
<label><input type="checkbox" value="2XL" class="size"> 2XL</label>
</div>

<label>تفاصيل المنتج</label>
<textarea id="p_details" rows="4" placeholder="الخامة، القصّة، الطباعة..."></textarea>

<label>معلومات الشحن</label>
<textarea id="p_shipping" rows="3" placeholder="مثال: شحن لكل المحافظات خلال 2-4 ايام، شحن مجاني فوق 1500ج"></textarea>

<label>الريفيوز - كل ريفيو في سطر: الاسم | التعليق | التقييم</label>
<textarea id="p_reviews" rows="3" placeholder="احمد | خامة تحفة | 5
سارة | المقاس مظبوط | 5"></textarea>

<button onclick="save()">حفظ المنتج ✅</button>
<p id="msg"></p>

<h3>المنتجات الحالية</h3>
<div id="list"></div>
</div>

<script>
const SUPABASE_URL = "https://uuxrjiytnnxsbhymkdfd.supabase.co";
const SUPABASE_KEY = "sb_publishable_xDrhCsbKo4hMjERVkERgFQ_DtDjRKNI";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function login(){
  const e = document.getElementById('email').value.trim();
  const p = document.getElementById('pass').value;
  if(e === 'admin@harfaa.com' && p === 'harfaa12345'){
    localStorage.setItem('harfaa_admin','1');
    show();
  } else {
    document.getElementById('err').innerText = 'الايميل او الباسورد غلط';
  }
}
function logout(){ localStorage.removeItem('harfaa_admin'); location.reload(); }
function show(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  load();
}
if(localStorage.getItem('harfaa_admin')) show();

async function save(){
  const sizes = [...document.querySelectorAll('.size:checked')].map(x=>x.value);
  const reviewsText = document.getElementById('p_reviews').value.trim();
  const reviews = reviewsText ? reviewsText.split('\n').map(l=>{
    const parts = l.split('|');
    return {name: parts[0]?.trim(), comment: parts[1]?.trim(), rating: parseInt(parts[2])||5};
  }) : [];
  const data = {
    name: document.getElementById('p_name').value,
    price: parseFloat(document.getElementById('p_price').value),
    old_price: parseFloat(document.getElementById('p_old').value) || null,
    image: document.getElementById('p_image').value,
    sizes: sizes,
    details: document.getElementById('p_details').value,
    shipping: document.getElementById('p_shipping').value,
    reviews: reviews
  };
  const {error} = await supabaseClient.from('products').insert(data);
  document.getElementById('msg').innerText = error ? 'خطأ: '+error.message : 'تم الحفظ ✅ وظهر في الموقع';
  if(!error) load();
}

async function load(){
  const {data} = await supabaseClient.from('products').select('*').order('created_at',{ascending:false});
  const list = document.getElementById('list');
  list.innerHTML = '';
  (data||[]).forEach(p=>{
    list.innerHTML += `<div class="card">
      ${p.image?`<img src="${p.image}">`:''}
      <h3>${p.name} - ${p.price}ج</h3>
      <p>مقاسات: ${(p.sizes||[]).join(' - ')}</p>
      <p>${p.details||''}</p>
      <p>شحن: ${p.shipping||''}</p>
      <p>ريفيوز: ${(p.reviews||[]).length}</p>
      <button onclick="del('${p.id}')" style="background:#ff4444;color:#fff">حذف</button>
    </div>`;
  });
}
async function del(id){ await supabaseClient.from('products').delete().eq('id',id); load(); }
</script>
</body>
</html>
