function nextHero(dir){let db=getDB();heroIndex=(heroIndex+dir+db.products.length)%db.products.length;updateHero();}
function toggleSidebar(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('sidebarOverlay').classList.toggle('show',open);}
function filterMenu(q){let items=document.querySelectorAll('#menuList .sideItem');q=q.toLowerCase();items.forEach(it=>{it.style.display=it.textContent.toLowerCase().includes(q)?'flex':'none';});}
function hideAllViews(){['homeView','featureView','productView','checkoutView','successView'].forEach(id=>document.getElementById(id).style.display='none');}
function showHome(){hideAllViews();document.getElementById('homeView').style.display='block';toggleSidebar(false);window.scrollTo({top:0,behavior:'smooth'});render();updateHero();}
function openShop(cat){toggleSidebar(false);hideAllViews();document.getElementById('homeView').style.display='block';let fc=document.getElementById('filterCat');if(fc)fc.value=cat==='All'?'':cat;render();window.scrollTo({top:document.getElementById('prods').offsetTop-80,behavior:'smooth'});}
function setSizeByIndex(idx,size,el){let db=getDB();let p=db.products[idx];if(!p)return;selSize[p.id]=size;if(el){let parent=el.parentElement;parent.querySelectorAll('.size').forEach(b=>b.classList.remove('active'));el.classList.add('active');}}
function getSelectedSize(p){return selSize[p.id]||'S';}
function render(){let db=getDB();let q=(document.getElementById('search')?.value||'').toLowerCase();let cat=document.getElementById('filterCat')?.value||'';let col=document.getElementById('filterColor')?.value||'';let sort=document.getElementById('sortBy')?.value||'';let list=db.products.filter(p=>(!cat||p.cat===cat)&&(!col||p.color===col)&&(!q||p.name.toLowerCase().includes(q)));if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='high')list.sort((a,b)=>b.price-a.price);let el=document.getElementById('prods');if(!el)return;if(!list.length){el.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#aaa">مفيش منتجات</p>';return;}el.innerHTML=list.map(p=>{let idx=db.products.indexOf(p);let cur=selSize[p.id]||'S';let sizes=(p.sizes&&p.sizes.length?p.sizes:SIZES);return `<div class="card"><span class="badge">${p.cat}</span><button class="favBtn" onclick="toggleFavByIndex(${idx})">${favs.includes(p.id)?'❤️':'🤍'}</button><img src="${p.img}" onclick="openProductPage(${idx})"><div class="cardBody"><b>${p.name}</b><div class="meta">${p.cat} • ${p.color}</div><div class="stars">⭐⭐⭐⭐⭐ 4.9</div><div class="lbl">🎨 اللون:</div><div class="dots">${COLOR_MAP.map(c=>`<div class="dot ${c.name===p.color?'active':''}" style="background:${c.bg}" onclick="event.stopPropagation();setCardColor(${idx},'${c.name}','${c.bg}')"></div>`).join('')}</div><div class="lbl">Choose your size:</div><div class="sizes">${sizes.map(s=>`<button class="size ${s===cur?'active':''}" onclick="event.stopPropagation();setSizeByIndex(${idx},'${s}',this)">${s}</button>`).join('')}</div><div class="priceRow"><span class="price">${p.price} جنيه</span><span class="stock">متوفر: ${p.stock}</span></div><button class="addBtn" onclick="event.stopPropagation();addToCartByIndex(${idx})">أضف للسلة 🛒</button><button class="btn2" onclick="openProductPage(${idx})">عرض المنتج</button></div></div>`;}).join('');updateCartUI();}
function setCardColor(idx,name,bg){let db=getDB();let p=db.products[idx];if(!p)return;p.color=name;p.bg=bg;render();if(idx===heroIndex)updateHero();}
function toggleFavByIndex(idx){let db=getDB();let p=db.products[idx];if(!p)return;if(favs.includes(p.id))favs=favs.filter(x=>String(x)!==String(p.id));else favs.push(p.id);localStorage.setItem('harfaa_favs',JSON.stringify(favs));render();}
function showFavs(){if(!favs.length){toast('مفيش مفضلة لسه');return;}let db=getDB();let list=db.products.filter(p=>favs.includes(p.id));document.getElementById('prods').innerHTML=list.map(p=>`<div class="card"><img src="${p.img}"><div class="cardBody"><b>${p.name}</b><div>${p.price} جنيه</div><button class="addBtn" onclick="addToCartByIndex(${db.products.indexOf(p)})">أضف للسلة</button></div></div>`).join('');}
function openProductPage(idx){let db=getDB();let p=db.products[idx];if(!p)return;hideAllViews();document.getElementById('productView').style.display='block';toggleSidebar(false);let light=isLightBg(p.bg);let related=db.products.filter(x=>x.id!==p.id).slice(0,4);let cur=getSelectedSize(p);let sizes=(p.sizes&&p.sizes.length?p.sizes:SIZES);document.getElementById('productContent').innerHTML=`<div style="background:${p.bg};color:${light?'#000':'#fff'};border-radius:18px;padding:16px;margin:14px 0"><div style="font-size:12px;opacity:.7">Home / ${p.cat} / ${p.name}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px"><div><div style="text-align:center">🪝</div><div style="text-align:center"><img src="${p.img}" style="width:100%;max-width:280px;height:300px;object-fit:cover;border-radius:14px"></div></div><div><h2 style="margin:0">${p.name}</h2><div style="color:#ffb400">⭐⭐⭐⭐⭐ 4.9 (124 تقييم)</div><div style="font-size:26px;font-weight:900;margin:8px 0">${p.price} جنيه ${p.old_price?`<s style="font-size:16px;opacity:.6">${p.old_price} جنيه</s>`:''}</div><p style="font-size:13px;opacity:.8;line-height:1.6">${p.desc}</p><div style="font-weight:800;margin:10px 0 6px">🎨 اللون:</div><div class="dots">${COLOR_MAP.map(c=>`<div class="dot ${c.name===p.color?'active':''}" style="background:${c.bg}" onclick="setProductColor(${idx},'${c.name}','${c.bg}')"></div>`).join('')}</div><div style="font-weight:800;margin:10px 0 6px">Choose your size:</div><div class="sizes">${sizes.map(s=>`<button class="size ${s===cur?'active':''}" onclick="setSizeByIndex(${idx},'${s}',this)">${s}</button>`).join('')}</div><div style="display:flex;gap:8px;align-items:center;margin:12px 0"><span>Quantity:</span><button class="size" onclick="changeQty(-1)">-</button><b id="prodQty">1</b><button class="size" onclick="changeQty(1)">+</button></div><button class="btn" style="width:100%;background:${light?'#000':'#fff'};color:${light?'#fff':'#000'}" onclick="addToCartByIndex(${idx},true);toggleCartDrawer(true)">Add to Cart</button><button class="btn" style="width:100%;margin-top:8px;background:#25D366" onclick="buyNowWhatsAppByIndex(${idx})">Buy Now via WhatsApp 💬</button><div style="font-size:12px;line-height:1.7;margin-top:10px;opacity:.85">💵 الدفع عند الاستلام<br>🚚 الشحن القاهرة والجيزة 60ج - باقي المحافظات 90ج<br>⏱️ التوصيل 2-4 ايام<br>🔄 استبدال مجاني خلال 14 يوم</div></div></div></div><h3>You may also like</h3><div class="grid">${related.map(r=>`<div class="card" onclick="openProductPage(${db.products.indexOf(r)})"><img src="${r.img}"><div class="cardBody"><b>${r.name}</b><div>${r.price} جنيه</div></div></div>`).join('')}</div>`;window.scrollTo({top:0,behavior:'smooth'});}
function setProductColor(idx,name,bg){let db=getDB();let p=db.products[idx];if(!p)return;p.color=name;p.bg=bg;openProductPage(idx);}
let prodQty=1;function changeQty(d){prodQty=Math.max(1,prodQty+d);let el=document.getElementById('prodQty');if(el)el.textContent=prodQty;}
function addToCartByIndex(idx,silent){let db=getDB();let p=db.products[idx];if(!p)return;let size=selSize[p.id]||'S';let found=cart.find(c=>String(c.id)==String(p.id)&&c.size===size);if(found)found.qty++;else cart.push({id:p.id,name:p.name,price:p.price,img:p.img,size:size,qty:1});updateCartUI();if(!silent){toast('✅ اتضاف: '+p.name+' - مقاس '+size);toggleCartDrawer(true);}}

function updateCartUI(){let total=cart.reduce((s,c)=>s+c.price*c.qty,0);let count=cart.reduce((s,c)=>s+c.qty,0);let c1=document.getElementById('cCount');if(c1)c1.textContent=count;let c2=document.getElementById('cItems');if(c2)c2.textContent=count+' منتج';let c3=document.getElementById('cTotal');if(c3)c3.textContent=total;let dc=document.getElementById('drawerCount');if(dc)dc.textContent=count;let di=document.getElementById('drawerItems');if(di)di.innerHTML=cart.length?cart.map((c,i)=>`<div style="display:flex;gap:10px;padding:10px;border:1px solid #222;border-radius:12px;margin-bottom:8px;align-items:center"><img src="${c.img}" style="width:56px;height:56px;object-fit:cover;border-radius:10px"><div style="flex:1"><b>${c.name}</b><br><small style="color:#aaa">مقاس: ${c.size} • ${c.price}ج</small><br><button onclick="changeCartQty(${i},-1)">-</button> ${c.qty} <button onclick="changeCartQty(${i},1)">+</button></div><button onclick="removeCart(${i})" style="background:#ff3b30;border:0;color:#fff;border-radius:50%;width:28px;height:28px">✖</button></div>`).join(''):'<p style="color:#888;text-align:center">السلة فاضية</p>';let ship=total>=800?0:(total===0?0:60);let ds=document.getElementById('drawerSummary');if(ds)ds.innerHTML=`<div style="display:flex;justify-content:space-between"><span>Subtotal</span><b>${total}ج</b></div><div style="display:flex;justify-content:space-between;margin-top:6px"><span>Shipping</span><b>${ship===0?'مجاني':ship+'ج'}</b></div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:18px"><span>Total</span><b>${total+ship}ج</b></div>`;let ft=document.getElementById('freeText');if(ft){ft.textContent=total>=800?'✅ وصلت للشحن المجاني':`فاضلك ${800-total}ج وتاخد شحن مجاني`;document.getElementById('freeFill').style.width=Math.min(100,total/8)+'%';}let fc=document.getElementById('favCount');if(fc)fc.textContent=favs.length;}
function changeCartQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCartUI();}
function removeCart(i){cart.splice(i,1);updateCartUI();}

else if(key==='scan')html=`<div class="scanBox"><video id="scanVideo" class="scanVideo" autoplay playsinline style="display:none"></video><button class="btn" style="width:100%" onclick="startScan()">📷 افتح الكاميرا</button><button class="btn" style="width:100%;margin-top:8px;background:#22c55e;display:none" id="captureBtn" onclick="captureScan()">📸 خد القياس</button><div id="scanResult"></div></div>`;
else if(key==='coins')html=`<div class="coinBox"><div class="coinBig">🪙 ${coins}</div><p style="text-align:center">تساوي <b>${Math.floor(coins/2)}ج</b></p><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="useCoins()">اشتري بيها</button><button class="btn" style="flex:1;background:#25D366" onclick="sellCoins()">بيعها</button></div></div>`;
else if(key==='points')html=`<div class="pointsBox"><b>🎁 نقاطك: ${points}</b><button style="background:#fff;border:0;padding:9px 14px;border-radius:999px;font-weight:800" onclick="redeemPoints()">بدّل نقاطي</button></div>`;
else if(key==='wheel')html=`<div class="wheelBox"><div class="wheel" id="wheel"></div><button class="btn" onclick="spinWheel()">لف العجلة 🎡</button><div id="wheelResult"></div></div>`;
else if(key==='scratch')html=`<div class="scratchBox"><div class="scratchArea" onclick="scratch(this)"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900">🎉 كسبت خصم 10% - SCRATCH10</div><div class="scratchCover" id="scratchCover">🪙 اخدش هنا</div></div></div>`;
else if(key==='size')html=`<div class="sizeHelper"><div style="display:flex;gap:8px"><input id="hInput" type="number" placeholder="طولك - 175"><input id="wInput" type="number" placeholder="وزنك - 75"></div><button class="btn" style="width:100%;margin-top:8px" onclick="calcSize()">اعرف مقاسي</button><div id="sizeResult"></div></div>`;
else if(key==='try')html=`<div class="tryBox"><input type="file" accept="image/*" onchange="tryOn(event)"><div class="tryPreview" id="tryPreview"><span style="font-size:60px">📸 ارفع صورتك</span></div></div>`;
else if(key==='design')html=`<div class="designBox"><input type="file" accept="image/*" onchange="designUpload(event)"><input id="designText" placeholder="اكتب اسمك" oninput="updateDesignText()" style="margin-top:8px"><div class="designPreview" id="designPreview"><div style="text-align:center"><div style="font-size:70px">👕</div><b id="designTextShow">HARFAA</b></div></div><button class="btn" style="width:100%;margin-top:10px" onclick="orderCustom()">اطلب تيشيرتي المخصص - 450ج 🎨</button></div>`;
else if(key==='box')html=`<div class="boxBox"><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="subscribeBox('شهري - 299ج')">شهري 299ج</button><button class="btn" style="flex:1" onclick="subscribeBox('3 شهور - 799ج')">3 شهور 799ج</button></div><div id="boxResult"></div></div>`;
else if(key==='vip')html=`<div class="vipBox"><h3>عضوية VIP 👑</h3><p style="color:#aaa">خصم 20% على طول + شحن مجاني</p><button class="btn" style="background:#ffb400;color:#000" onclick="joinVIP()">اشترك في VIP 👑</button></div>`;
else if(key==='ref')html=`<div class="refBox"><input id="refLink" value="https://harfaa.store?ref=HARFAA50" readonly><button class="btn2" onclick="copyRef()">نسخ اللينك</button><p>رصيدك: <b>${refBalance}ج</b></p><button class="btn2" onclick="claimRef()">اطلب الـ 50ج 💸</button></div>`;
else if(key==='birth')html=`<div class="birthBox"><div style="display:flex;gap:8px"><input id="birthInput" type="date"><button class="btn" onclick="saveBirthday()">سجّل 🎂</button></div><div id="birthResult"></div></div>`;
else if(key==='look')html=`<div class="lookBox"><img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=800&q=80"><button class="btn" style="width:100%;margin-top:10px" onclick="addToCartByIndex(5)">اضف اللوك - 850ج</button></div>`;
else if(key==='pay')html=`<div style="background:#161617;border:1px solid #222;border-radius:14px;padding:14px"><b>💳 طرق الدفع</b><div class="payIcons"><div>💵<br>كاش</div><div>📱<br>فودافون كاش<br><b>01032176585</b></div><div>🏦<br>انستا باي<br><b>01032176585</b></div></div></div>`;
document.getElementById('featureContent').innerHTML=html;window.scrollTo({top:0,behavior:'smooth'});if(key==='stories')renderStories2();if(key==='league')renderLeague2();}
function renderStories2(){let stories=getAIStories();let el=document.getElementById('storiesRow2');if(!el)return;el.innerHTML=stories.map((s,i)=>`<div class="storyCircle" onclick="openStory(${i})"><img src="${s.img}"><span>${s.t}</span></div>`).join('');}
function renderLeague2(){let board=[{n:'عمر - القاهرة',p:1250},{n:'انت',p:leaguePoints}].sort((a,b)=>b.p-a.p);let el=document.getElementById('leagueBoard2');if(el)el.innerHTML=board.map((b,i)=>`<div class="leagueRow"><span>${i+1}. ${b.n}</span><b>${b.p} نقطة</b></div>`).join('');}
function getAIStories(){return [{t:'خصم اليوم 🔥',txt:'خصم 15% بكود STORY15',img:'https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400&q=80'},{t:'ورا الكواليس 🎬',txt:'شوف ازاي بنعمل التيشيرت',img:'https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=400&q=80'},{t:'لوك اليوم 👌',txt:'تيشيرت اسود + هودي بيج',img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&q=80'},{t:'عميل اليوم ⭐',txt:'عمر: الخامة تحفة',img:'https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=400&q=80'}];}
function openStory(i){let s=getAIStories()[i];document.getElementById('storyImg').src=s.img;document.getElementById('storyTitle').textContent=s.t;document.getElementById('storyText').textContent=s.txt;document.getElementById('storyModal').style.display='flex';}
function joinLeague(){let n=document.getElementById('leagueName').value.trim();if(!n)return alert('اكتب اسمك');leaguePoints+=50;localStorage.setItem('harfaa_league',leaguePoints);renderLeague2();toast('اشتركت في الليج +50 نقطة');}
function joinMystery(){let n=document.getElementById('mysteryName').value.trim();let ph=document.getElementById('mysteryPhone').value.trim();if(!n||!ph)return alert('اكتب اسمك ورقمك');window.open('https://wa.me/'+WHATS_NUMBER+'?text='+encodeURIComponent('عايز ادخل سحب العميل السري - '+n+' - '+ph));}
function stylistUpload(e){let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);document.getElementById('stylistPreview').innerHTML='<img src="'+url+'">';}
function runStylist(){let skin=document.getElementById('stylistSkin').value;if(!skin)return alert('اختار لون بشرتك');let color=skin==='فاتح'?'بيج':skin==='قمحي'?'اخضر زيتي':'ابيض';document.getElementById('stylistResult').innerHTML=`<div style="background:#0f0f0f;padding:12px;border-radius:12px">اللون اللي هيليق عليك: <b>${color}</b></div>`;}
function showPayInfo(){let v=document.getElementById('payMethod').value;let box=document.getElementById('payInfo');let proof=document.getElementById('proofBox');if(v==='Vodafone Cash'){box.style.display='block';box.innerHTML='📱 حول على فودافون كاش: <b>'+PAY_NUMBER+'</b>';proof.style.display='block';}else if(v==='InstaPay'){box.style.display='block';box.innerHTML='🏦 حول على انستا باي: <b>'+PAY_NUMBER+'</b>';proof.style.display='block';}else{box.style.display='none';if(proof)proof.style.display='none';}}
function previewProof(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{proofUploaded=true;proofName=f.name;document.getElementById('proofPreview').innerHTML='<img src="'+ev.target.result+'">';};r.readAsDataURL(f);}
async function trackOrder(){let id=document.getElementById('trackInput').value.trim();let phone=document.getElementById('trackPhone').value.trim();if(!id){toast('اكتب كود الطلب');return;}let {data}=await sb.from('harfas_orders').select('*').eq('code',id).maybeSingle();document.getElementById('trackResult').innerHTML=data?`<div style="background:#0f0f0f;padding:12px;border-radius:12px;margin-top:10px">طلبك <b>${data.code}</b> - الحالة: <b>${data.status}</b><br>الاجمالي: ${data.total}ج</div>`:'<p style="color:#ff6b6b">مش لاقيين الطلب ده، اتأكد من الكود</p>';}
function spinWheel(){let w=document.getElementById('wheel');let deg=1440+Math.floor(Math.random()*360);w.style.transform='rotate('+deg+'deg)';setTimeout(()=>{document.getElementById('wheelResult').innerHTML='<div style="background:#0f0f0f;padding:12px;border-radius:12px;margin-top:10px">🎉 كسبت خصم 10% - كود: <b>HARFAA10</b></div>';},2100);}
function scratch(el){let c=document.getElementById('scratchCover');if(c)c.style.display='none';}
function calcSize(){let h=parseInt(document.getElementById('hInput').value);let w=parseInt(document.getElementById('wInput').value);if(!h||!w)return alert('اكتب طولك ووزنك');let size=h>185||w>100?'2XL':h>175||w>85?'XL':h>165?'L':'M';document.getElementById('sizeResult').innerHTML=`<div style="background:#0f0f0f;padding:12px;border-radius:12px;margin-top:10px">مقاسك المناسب: <b>${size}</b></div>`;}
function tryOn(e){let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);document.getElementById('tryPreview').innerHTML='<img src="'+url+'"><div style="position:absolute;bottom:10px;font-size:60px">👕</div>';}
function designUpload(e){let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);document.getElementById('designPreview').innerHTML='<img src="'+url+'" style="max-width:80%;max-height:80%">';}
function updateDesignText(){let v=document.getElementById('designText').value;let el=document.getElementById('designTextShow');if(el)el.textContent=v||'HARFAA';}
function orderCustom(){toast('تم استلام طلب التصميم المخصص 🎨');}
function subscribeBox(v){document.getElementById('boxResult').innerHTML='<div style="background:#0f0f0f;padding:12px;border-radius:12px;margin-top:10px">اشتركت في بوكس '+v+' ✅ هنتواصل معاك على واتساب</div>';}
function joinVIP(){window.open('https://wa.me/'+WHATS_NUMBER+'?text='+encodeURIComponent('عايز اشترك VIP')); }
function copyRef(){let i=document.getElementById('refLink');i.select();document.execCommand('copy');toast('اتنسخ ✅');}
function claimRef(){toast('تم ارسال طلب الـ 50ج 💸');}
function saveBirthday(){document.getElementById('birthResult').innerHTML='<div style="background:#0f0f0f;padding:12px;border-radius:12px;margin-top:10px">🎂 تم التسجيل! كود خصمك: BIRTH10</div>';}
function redeemPoints(){toast('تم تبديل النقاط بخصم 10% - كود: POINTS10');}
function useCoins(){toast('تم استخدام الكوينز ✅');}
function sellCoins(){window.open('https://wa.me/'+WHATS_NUMBER+'?text='+encodeURIComponent('عايز ابيع الكوينز بتاعتي')); }
function startScan(){toast('افتح الكاميرا من المتصفح واسمح بالوصول');}
function captureScan(){document.getElementById('scanResult').innerHTML='<div style="background:#0f0f0f;padding:12px;border-radius:12px;margin-top:10px">مقاسك التقريبي: <b>L</b></div>';}
function startCountdown(){let end=localStorage.getItem('harfaa_offer_end');if(!end){end=Date.now()+2*24*60*60*1000;localStorage.setItem('harfaa_offer_end',end);}setInterval(()=>{let diff=Math.max(0,Number(end)-Date.now());let d=Math.floor(diff/86400000);let h=Math.floor(diff%86400000/3600000);let m=Math.floor(diff%3600000/60000);let s=Math.floor(diff%60000/1000);let el=document.getElementById('countdown');if(el)el.textContent=String(d).padStart(2,'0')+' : '+String(h).padStart(2,'0')+' : '+String(m).padStart(2,'0')+' : '+String(s).padStart(2,'0');},1000);}
startCountdown();render();updateHero();loadFromSupabase();
</script></body></html>
