<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harfaa Wear | لبس يمثل هويتك</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><style>:root{--accent:#ff3b30;--accent2:#ff6b60}*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:'Cairo',system-ui;transition:background .4s}header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,10,.9);position:sticky;top:0;z-index:20;border-bottom:1px solid #222}header b{font-size:24px}header b span{color:var(--accent)} .topbtn{background:#1a1a1a;border:1px solid #333;color:#fff;padding:9px 14px;border-radius:999px;cursor:pointer}.hero{background:linear-gradient(180deg,rgba(0,0,0,.3),#0a0a0a),url('https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=1000&q=80');background-size:cover;background-position:center;padding:70px 18px 90px;text-align:center;position:relative;overflow:hidden}.hero h1{font-size:38px;line-height:1.2;margin:0;font-weight:900}.hero h1 span{color:var(--accent)}.hero p{color:#ddd;font-size:16px;margin:14px 0 20px}.btn{background:var(--accent);color:#fff;border:0;padding:13px 22px;border-radius:999px;font-weight:800;cursor:pointer;font-family:inherit;font-size:15px;transition:.3s}.btn2{background:#1a1a1a;color:#fff;border:1px solid #333;padding:10px 14px;border-radius:999px;cursor:pointer;font-family:inherit}.wrap{padding:20px 16px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:52px}}.card{background:#161616;border:1px solid #262626;border-radius:18px;overflow:hidden}.card img{width:100%;height:220px;object-fit:cover;transition:.3s}.card .p{padding:14px}.meta{color:#999;font-size:12px;margin:6px 0}.priceRow{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.price{font-weight:900;font-size:19px}.price small{color:var(--accent)}.stock{font-size:11px;background:#222;padding:4px 8px;border-radius:999px}.addBtn{width:100%;background:var(--accent);color:#fff;border:0;padding:11px;border-radius:999px;font-weight:800;cursor:pointer;font-family:inherit}.colorRow{display:flex;gap:8px;margin:10px 0;align-items:center}.dot{width:28px;height:28px;border-radius:50%;border:2px solid #fff;cursor:pointer}.dot.active{outline:3px solid var(--accent);transform:scale(1.15)}.cartBar{position:fixed;bottom:12px;left:12px;right:12px;background:#fff;color:#000;padding:12px 14px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5)}input,select{padding:12px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-family:inherit;width:100%}.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center;z-index:40}.modal>div{background:#161616;padding:18px;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;overflow:auto}.badge{background:var(--accent);color:#fff;padding:3px 8px;border-radius:999px;font-size:11px}.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0;text-align:center}.feat div{background:#161616;border:1px solid #222;padding:12px;border-radius:14px;font-size:13px}.snow{position:fixed;top:-10px;color:#fff;font-size:14px;z-index:99;pointer-events:none;animation:fall linear infinite;opacity:.8}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}.colorPreview{height:120px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:12px;transition:.4s}</style></head><body>
<div id="snowBox"></div>
<header><b>Harfaa <span>Wear</span></b><button class="topbtn" onclick="openCart()">🛒 السلة (<span id="cCount">0</span>)</button></header>
<div class="hero"><div style="display:inline-block;background:var(--accent);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800">❄️ WINTER DROP - 2026 ❄️</div><h1>لبس يمثل <span id="heroColorText">هويتك</span><br>مش مجرد لبس</h1><p>اختار لونك، والموقع كله هيتلون بيك ✨</p><div style="display:flex;gap:8px;justify-content:center;margin:16px 0"><div class="dot active" style="background:#111" onclick="setTheme('#111','#ff3b30','اسود',this)"></div><div class="dot" style="background:#d2b48c" onclick="setTheme('#d2b48c','#d2b48c','بيج',this)"></div><div class="dot" style="background:#ff3b30" onclick="setTheme('#ff3b30','#ff3b30','احمر',this)"></div><div class="dot" style="background:#1a5c3a" onclick="setTheme('#1a5c3a','#1a5c3a','اخضر',this)"></div><div class="dot" style="background:#2a4a8a" onclick="setTheme('#2a4a8a','#2a4a8a','ازرق',this)"></div><div class="dot" style="background:#f5f5f5" onclick="setTheme('#f5f5f5','#333','ابيض',this)"></div></div><p id="selectedColorLabel" style="font-size:14px;color:#ddd">اللون المختار: <b>اسود</b></p><button class="btn" onclick="document.getElementById('prods').scrollIntoView({behavior:'smooth'})">تسوق الان ↓</button></div>
<div class="wrap"><div class="feat"><div><b>❄️</b>شتوي<br><span style="color:#999">هوديز تقيلة</span></div><div><b>💯</b>قطن 100%<br><span style="color:#999">جودة مضمونة</span></div><div><b>🚚</b>شحن سريع<br><span style="color:#999">كل المحافظات</span></div></div>
<h2>🔥 المنتجات - اختار لونك</h2><div style="display:flex;gap:10px;margin:16px 0"><input id="search" placeholder="🔍 ابحث..." oninput="render()"><select id="filterCat" onchange="render()" style="max-width:130px"><option value="">كل الأقسام</option><option>تيشيرت</option><option>هودي</option></select></div><div id="prods" class="grid"></div></div>
<div class="cartBar"><div><b>🛒 السلة:</b> <span id="cTotal">0</span> ج • <span id="cItems">0 منتج</span></div><button class="btn" style="padding:10px 18px" onclick="openCart()">اتمام الطلب →</button></div>
<div class="modal" id="cartModal"><div><h3>اتمام الطلب 🛒</h3><div id="cartItems"></div><input id="custName" placeholder="الاسم بالكامل *"><input id="custPhone" placeholder="رقم الموبايل *"><input id="custAddr" placeholder="العنوان بالتفصيل *"><select id="custGov"><option>القاهرة</option><option>الجيزة</option><option>الاسكندرية</option><option>باقي المحافظات</option></select><select id="payMethod"><option value="COD">الدفع عند الاستلام</option><option value="Vodafone Cash">فودافون كاش</option></select><input id="coupon" placeholder="كود الخصم (جرب HARFAA10)"><div id="summary" style="background:#0f0f0f;padding:12px;border-radius:12px;margin:10px 0;font-size:14px;border:1px solid #222"></div><button class="btn" style="width:100%" onclick="placeOrder()">تأكيد الطلب على واتساب ✅</button><button class="btn2" style="width:100%;margin-top:8px" onclick="closeCart()">اغلاق</button></div></div>
<script>
let cart=[];let selectedColors={};
function setTheme(color,accent,name,el){document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--accent2',accent);if(el){document.querySelectorAll('.hero .dot').forEach(d=>d.classList.remove('active'));el.classList.add('active');}document.getElementById('selectedColorLabel').innerHTML='اللون المختار: <b>'+name+'</b>';document.getElementById('heroColorText').textContent=name;let hero=document.querySelector('.hero');hero.style.background='linear-gradient(180deg,'+color+'55,#0a0a0a),url("https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=1000&q=80")';hero.style.backgroundSize='cover';hero.style.backgroundPosition='center';}
function setProdColor(id,color,accent,name,el){selectedColors[id]=name;document.documentElement.style.setProperty('--accent',accent);document.getElementById('selectedColorLabel').innerHTML='اللون المختار: <b>'+name+' - للمنتج</b>';let preview=document.getElementById('preview-'+id);if(preview){preview.style.background=color;preview.textContent='👕 '+name;}if(el){let parent=el.parentElement;parent.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));el.classList.add('active');}}
function makeSnow(){let box=document.getElementById('snowBox');let emojis=['❄','❅','❆','•'];for(let i=0;i<28;i++){let s=document.createElement('div');s.className='snow';s.textContent=emojis[Math.floor(Math.random()*emojis.length)];s.style.left=Math.random()*100+'vw';s.style.fontSize=(8+Math.random()*14)+'px';s.style.animationDuration=(6+Math.random()*8)+'s';s.style.animationDelay=(Math.random()*6)+'s';s.style.opacity=.4+Math.random()*.6;box.appendChild(s);}}
function getDB(){let d=JSON.parse(localStorage.getItem('harfaa_db')||'null');if(!d){d={products:[{id:1,name:'تيشيرت Harfaa',price:350,img:'',color:'اسود',cat:'تيشيرت',stock:5,desc:'قطن 100%'},{id:2,name:'هودي Harfaa',price:650,img:'',color:'بيج',cat:'هودي',stock:12,desc:'هودي شتوي تقيل'}],orders:[],coupons:[{code:'HARFAA10',val:10,type:'percent',min:0,active:true,used:0}],settings:{whats:'201000000000',cash:'01000000000',shipCairo:60,shipOther:90},editor:{}};localStorage.setItem('harfaa_db',JSON.stringify(d));}return d;}
function render(){let db=getDB();let q=document.getElementById('search').value.toLowerCase();let cat=document.getElementById('filterCat').value;let list=db.products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!cat||p.cat===cat));document.getElementById('prods').innerHTML=list.map(p=>{let cols=[{n:'اسود',c:'#111',a:'#ff3b30'},{n:'بيج',c:'#d2b48c',a:'#d2b48c'},{n:'احمر',c:'#ff3b30',a:'#ff3b30'},{n:'اخضر',c:'#1a5c3a',a:'#1a5c3a'},{n:'ازرق',c:'#2a4a8a',a:'#2a4a8a'}];return `<div class="card"><div id="preview-${p.id}" class="colorPreview" style="background:${p.color==='بيج'?'#d2b48c':'#111'}">👕</div><div class="p"><b>${p.name}</b><div class="meta">${p.cat} • ${p.desc}</div><div style="font-size:13px">اختار اللون:</div><div class="colorRow">${cols.map(c=>`<div class="dot ${p.color===c.n?'active':''}" style="background:${c.c}" onclick="setProdColor(${p.id},'${c.c}','${c.a}','${c.n}',this)"></div>`).join('')}<span style="font-size:12px;color:#999">${selectedColors[p.id]||p.color}</span></div><div class="priceRow"><span class="price">${p.price} <small>ج</small></span><span class="stock">${p.stock<=0?'❌ نفذ':p.stock<10?'⚠️ باقي '+p.stock: '✅ متوفر'}</span></div><button class="addBtn" onclick="addToCart(${p.id})" ${p.stock<=0?'disabled':''}>+ اضف للسلة - ${selectedColors[p.id]||p.color}</button></div></div>`}).join('')||'<p>لا يوجد منتجات</p>';updateCartUI();}
function addToCart(id){let db=getDB();let p=db.products.find(x=>x.id==id);if(!p)return;let col=selectedColors[id]||p.color;let ex=cart.find(x=>x.id==id&&x.col===col);if(ex)ex.qty++;else cart.push({id:p.id,name:p.name+' - '+col,price:p.price,qty:1,col:col});updateCartUI();}
function updateCartUI(){document.getElementById('cCount').textContent=cart.reduce((s,i)=>s+i.qty,0);document.getElementById('cTotal').textContent=cart.reduce((s,i)=>s+i.price*i.qty,0);document.getElementById('cItems').textContent=cart.length+' منتج';}
function openCart(){if(cart.length===0)return alert('السلة فاضية');document.getElementById('cartModal').style.display='flex';let db=getDB();let sub=cart.reduce((s,i)=>s+i.price*i.qty,0);let gov=document.getElementById('custGov').value;let ship=gov==='القاهرة'?db.settings.shipCairo:db.settings.shipOther;let disc=0;let code=document.getElementById('coupon').value.trim().toUpperCase();let cp=db.coupons.find(c=>c.code===code&&c.active);if(cp){disc=cp.type==='percent'?Math.round(sub*cp.val/100):cp.val;}document.getElementById('cartItems').innerHTML=cart.map(i=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222">${i.name} x ${i.qty} <b>${i.price*i.qty} ج</b></div>`).join('');document.getElementById('summary').innerHTML=`المجموع: ${sub} ج<br>الشحن: ${ship} ج<br>الخصم: -${disc} ج<br><b>الاجمالي: ${sub+ship-disc} ج</b>`;}
function closeCart(){document.getElementById('cartModal').style.display='none';}
function placeOrder(){let name=document.getElementById('custName').value.trim();let phone=document.getElementById('custPhone').value.trim();let addr=document.getElementById('custAddr').value.trim();if(!name||!phone||!addr)return alert('كمل بياناتك');if(cart.length===0)return alert('السلة فاضية');let db=getDB();let sub=cart.reduce((s,i)=>s+i.price*i.qty,0);let gov=document.getElementById('custGov').value;let ship=gov==='القاهرة'?db.settings.shipCairo:db.settings.shipOther;let disc=0;let code=document.getElementById('coupon').value.trim().toUpperCase();let cp=db.coupons.find(c=>c.code===code&&c.active);if(cp){disc=cp.type==='percent'?Math.round(sub*cp.val/100):cp.val;cp.used++;}let total=sub+ship-disc;let itemsText=cart.map(i=>i.name+' x'+i.qty).join(' - ');let order={id:'H-'+Math.floor(1000+Math.random()*9000),name:name,phone:phone,addr:addr+' - '+gov,total:total,status:'New',items:itemsText,pay:document.getElementById('payMethod').value,date:new Date().toLocaleDateString('ar-EG')};db.orders.push(order);cart.forEach(ci=>{let p=db.products.find(x=>x.id==ci.id);if(p)p.stock=Math.max(0,p.stock-ci.qty);});localStorage.setItem('harfaa_db',JSON.stringify(db));let msg=`طلب جديد Harfaa 🔥\nرقم: ${order.id}\nالاسم: ${name}\nالموبايل: ${phone}\nالعنوان: ${addr} - ${gov}\nالمنتجات: ${itemsText}\nالاجمالي: ${total} ج`;window.open('https://wa.me/'+db.settings.whats+'?text='+encodeURIComponent(msg));alert('تم ✅ رقم طلبك '+order.id);cart=[];updateCartUI();closeCart();render();}
makeSnow();render();
</script></body></html>
