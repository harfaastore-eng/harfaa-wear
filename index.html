<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harfaa Wear - لبس يمثل هويتك</title><style>body{margin:0;background:#0f0f0f;color:#fff;font-family:system-ui}header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#111;position:sticky;top:0;z-index:10}header b{font-size:22px}header b span{color:#ff3b30}.btn{background:#ff3b30;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer}.btn2{background:#1a1a1a;color:#fff;border:1px solid #333;padding:8px 12px;border-radius:10px;cursor:pointer}.hero{padding:30px 16px;text-align:center;background:linear-gradient(180deg,#1a1a1a,#0f0f0f)}.hero h1{font-size:32px;margin:10px 0}.hero p{color:#aaa}.wrap{padding:16px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}.card{background:#1a1a1a;border:1px solid #222;border-radius:14px;overflow:hidden}.card img{width:100%;height:180px;object-fit:cover;background:#222}.card .p{padding:12px}.price{color:#ff3b30;font-weight:800;font-size:18px}.cart{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:1px solid #333;padding:12px;display:flex;justify-content:space-between;align-items:center;z-index:20}input,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#111;color:#fff;box-sizing:border-box}.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal>div{background:#1a1a1a;padding:18px;border-radius:14px;width:100%;max-width:420px}.hidden{display:none}</style></head><body>
<header><b>Harfaa <span>Wear</span></b><button class="btn2" onclick="openCart()">🛒 السلة (<span id="cCount">0</span>)</button></header>
<div class="hero"><h1 id="heroTitle">لبس يمثل هويتك</h1><p id="heroDesc">تيشيرتات وهوديز بجودة عالية - شحن لكل المحافظات</p><button class="btn" onclick="document.getElementById('prods').scrollIntoView({behavior:'smooth'})">تسوق الان ↓</button></div>
<div class="wrap"><h2>المنتجات</h2><div style="display:flex;gap:8px;margin-bottom:12px"><input id="search" placeholder="ابحث عن منتج..." oninput="render()"><select id="filterCat" onchange="render()"><option value="">كل الأقسام</option><option>تيشيرت</option><option>هودي</option></select></div><div id="prods" class="grid"></div></div>
<div class="cart"><div><b>السلة:</b> <span id="cTotal">0</span> ج - <span id="cItems">0 منتج</span></div><button class="btn" onclick="openCart()">اتمام الطلب</button></div>
<div class="modal" id="cartModal"><div><h3>اتمام الطلب</h3><div id="cartItems"></div><input id="custName" placeholder="الاسم بالكامل *"><input id="custPhone" placeholder="رقم الموبايل *"><input id="custAddr" placeholder="العنوان بالتفصيل *"><select id="custGov"><option>القاهرة</option><option>الجيزة</option><option>الاسكندرية</option><option>باقي المحافظات</option></select><select id="payMethod"><option value="COD">الدفع عند الاستلام</option><option value="Vodafone Cash">فودافون كاش</option></select><input id="coupon" placeholder="كود الخصم (اختياري)"><div id="summary" style="background:#111;padding:10px;border-radius:8px;margin:8px 0;font-size:14px"></div><button class="btn" style="width:100%" onclick="placeOrder()">تأكيد الطلب على واتساب ✅</button><button class="btn2" style="width:100%;margin-top:8px" onclick="closeCart()">اغلاق</button></div></div>
<script>
let cart=[];
function getDB(){let d=JSON.parse(localStorage.getItem('harfaa_db')||'null');if(!d){d={products:[{id:1,name:'تيشيرت Harfaa اسود',price:350,img:'',color:'اسود',cat:'تيشيرت',stock:5,desc:'قطن 100%'},{id:2,name:'هودي Harfaa بيج',price:650,img:'',color:'بيج',cat:'هودي',stock:12,desc:'هودي شتوي تقيل'}],orders:[],coupons:[{code:'HARFAA10',val:10,type:'percent',min:0,active:true,used:0}],settings:{whats:'201000000000',cash:'01000000000',shipCairo:60,shipOther:90},editor:{title:'لبس يمثل هويتك',desc:'تيشيرتات وهوديز بجودة عالية',btn:'تسوق الان'}};localStorage.setItem('harfaa_db',JSON.stringify(d));}return d;}
function render(){let db=getDB();let q=document.getElementById('search').value.toLowerCase();let cat=document.getElementById('filterCat').value;let list=db.products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!cat||p.cat===cat));document.getElementById('heroTitle').textContent=db.editor.title||'لبس يمثل هويتك';document.getElementById('heroDesc').textContent=db.editor.desc||'';document.getElementById('prods').innerHTML=list.map(p=>`<div class="card">${p.img?`<img src="${p.img}">`:`<div style="height:180px;background:#222;display:flex;align-items:center;justify-content:center;font-size:50px">👕</div>`}<div class="p"><b>${p.name}</b><div style="color:#aaa;font-size:13px">${p.color||''} - ${p.cat||''} - ${p.desc||''}</div><div style="margin:8px 0"><span class="price">${p.price} ج</span> <span style="color:#aaa;font-size:12px">${p.stock<=0?'❌ نفذ':p.stock<10?'⚠️ باقي '+p.stock:''}</span></div><button class="btn" style="width:100%" onclick="addToCart(${p.id})" ${p.stock<=0?'disabled':''}>اضف للسلة</button></div></div>`).join('')||'<p>لا يوجد منتجات</p>';updateCartUI();}
function addToCart(id){let db=getDB();let p=db.products.find(x=>x.id==id);if(!p)return;let ex=cart.find(x=>x.id==id);if(ex)ex.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1});updateCartUI();alert('تمت الاضافة ✅ '+p.name);}
function updateCartUI(){let total=cart.reduce((s,i)=>s+i.price*i.qty,0);document.getElementById('cCount').textContent=cart.reduce((s,i)=>s+i.qty,0);document.getElementById('cTotal').textContent=total;document.getElementById('cItems').textContent=cart.length+' منتج';}
function openCart(){if(cart.length===0)return alert('السلة فاضية');document.getElementById('cartModal').style.display='flex';let db=getDB();let sub=cart.reduce((s,i)=>s+i.price*i.qty,0);let gov=document.getElementById('custGov').value;let ship=gov==='القاهرة'?db.settings.shipCairo:db.settings.shipOther;let disc=0;let code=document.getElementById('coupon').value.trim().toUpperCase();let cp=db.coupons.find(c=>c.code===code&&c.active);if(cp){disc=cp.type==='percent'?Math.round(sub*cp.val/100):cp.val;}document.getElementById('cartItems').innerHTML=cart.map(i=>`${i.name} x ${i.qty} = ${i.price*i.qty} ج <button onclick="removeItem(${i.id})">❌</button>`).join('<br>');document.getElementById('summary').innerHTML=`المجموع: ${sub} ج<br>الشحن: ${ship} ج<br>الخصم: -${disc} ج<br><b>الاجمالي: ${sub+ship-disc} ج</b>`;}
function removeItem(id){cart=cart.filter(i=>i.id!==id);updateCartUI();openCart();}
function closeCart(){document.getElementById('cartModal').style.display='none';}
function placeOrder(){let name=document.getElementById('custName').value.trim();let phone=document.getElementById('custPhone').value.trim();let addr=document.getElementById('custAddr').value.trim();if(!name||!phone||!addr)return alert('كمل بياناتك الاول');if(cart.length===0)return alert('السلة فاضية');let db=getDB();let sub=cart.reduce((s,i)=>s+i.price*i.qty,0);let gov=document.getElementById('custGov').value;let ship=gov==='القاهرة'?db.settings.shipCairo:db.settings.shipOther;let disc=0;let code=document.getElementById('coupon').value.trim().toUpperCase();let cp=db.coupons.find(c=>c.code===code&&c.active);if(cp){disc=cp.type==='percent'?Math.round(sub*cp.val/100):cp.val;cp.used++;}let total=sub+ship-disc;let itemsText=cart.map(i=>i.name+' x'+i.qty).join(' - ');let order={id:'H-'+Math.floor(1000+Math.random()*9000),name:name,phone:phone,addr:addr+' - '+gov,total:total,status:'New',items:itemsText,pay:document.getElementById('payMethod').value,date:new Date().toLocaleDateString('ar-EG')};db.orders.push(order);cart.forEach(ci=>{let p=db.products.find(x=>x.id==ci.id);if(p)p.stock=Math.max(0,p.stock-ci.qty);});localStorage.setItem('harfaa_db',JSON.stringify(db));let msg=`طلب جديد من Harfaa 🔥\nرقم الطلب: ${order.id}\nالاسم: ${name}\nالموبايل: ${phone}\nالعنوان: ${addr} - ${gov}\nالمنتجات: ${itemsText}\nالدفع: ${order.pay}\nالشحن: ${ship} ج\nالاجمالي: ${total} ج`;window.open('https://wa.me/'+db.settings.whats+'?text='+encodeURIComponent(msg));alert('تم استلام طلبك ✅ رقم طلبك '+order.id);cart=[];updateCartUI();closeCart();render();}
document.getElementById('custGov').addEventListener('change',()=>{if(cart.length)openCart();});
document.getElementById('coupon').addEventListener('input',()=>{if(cart.length)openCart();});
render();
</script></body></html>
