<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harfaa Wear | لبس يمثل هويتك</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><style>:root{--accent:#ff3b30}*{box-sizing:border-box}body{margin:0;background:#0b0b0c;color:#fff;font-family:'Cairo',system-ui;padding-bottom:90px}header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#0b0b0c;position:sticky;top:0;z-index:20;border-bottom:1px solid #1f1f1f}header b{font-size:23px}header b span{color:var(--accent)}.topbtn{background:#1c1c1e;border:1px solid #2c2c2e;color:#fff;padding:8px 14px;border-radius:999px}.hero{padding:38px 16px 30px;text-align:center;background:radial-gradient(ellipse at top,var(--accent)33,#0b0b0c 65%)}.hero .tag{display:inline-block;background:var(--accent);color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800}.hero h1{font-size:34px;line-height:1.25;margin:16px 0 8px;font-weight:900}.hero h1 span{color:var(--accent)}.hero p{color:#b0b0b0;font-size:15px;margin:0 0 18px}.colorPick{display:flex;gap:10px;justify-content:center;margin:14px 0}.dot{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.9);cursor:pointer;flex-shrink:0}.dot.active{outline:3px solid #fff;outline-offset:2px;transform:scale(1.1)}.btn{background:var(--accent);color:#fff;border:0;padding:13px 24px;border-radius:999px;font-weight:800;font-family:inherit;font-size:15px}.wrap{padding:16px;max-width:1100px;margin:auto}.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px}.feat div{background:#161617;border:1px solid #222;padding:12px 6px;border-radius:14px;text-align:center;font-size:12px;line-height:1.6}.feat b{font-size:17px}.searchRow{display:flex;gap:10px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:44px}}.card{background:#161617;border:1px solid #232326;border-radius:18px;overflow:hidden}.preview{height:160px;display:flex;align-items:center;justify-content:center;font-size:78px;transition:.3s}.cardBody{padding:13px}.cardBody b{font-size:15px;display:block;line-height:1.4}.meta{color:#8e8e93;font-size:12px;margin:5px 0}.lbl{font-size:12px;color:#aaa;margin:10px 0 6px}.dots{display:flex;gap:8px;align-items:center}.dots .dot{width:24px;height:24px}.priceRow{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.price{font-size:18px;font-weight:900}.price small{color:var(--accent);font-size:13px}.stock{font-size:11px;background:#222;padding:4px 8px;border-radius:999px}.addBtn{width:100%;background:#fff;color:#000;border:0;padding:11px;border-radius:999px;font-weight:800;font-family:inherit}.addBtn:active{background:var(--accent);color:#fff}.cartBar{position:fixed;bottom:10px;left:10px;right:10px;background:#fff;color:#000;padding:12px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5)}input,select{padding:11px;border-radius:12px;border:1px solid #2c2c2e;background:#161617;color:#fff;font-family:inherit;width:100%;font-size:14px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center;z-index:40}.modal>div{background:#161617;padding:18px;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;overflow:auto}.snow{position:fixed;top:-10px;color:#fff;z-index:5;pointer-events:none;animation:fall linear infinite;opacity:.55}@keyframes fall{to{transform:translateY(110vh)}}.btn2{background:#1c1c1e;color:#fff;border:1px solid #2c2c2e;padding:10px;border-radius:999px;width:100%;margin-top:8px;font-family:inherit}</style></head><body>
<div id="snowBox"></div>
<header><b>Harfaa <span>Wear</span></b><button class="topbtn" onclick="openCart()">🛒 السلة (<span id="cCount">0</span>)</button></header>
<div class="hero"><span class="tag">❄️ WINTER DROP 2026</span><h1>لبس يمثل <span id="heroColor">هويتك</span><br>مش مجرد لبس</h1><p>اختار لونك، والموقع كله هيتلون بيك</p><div class="colorPick" id="heroDots"><div class="dot active" style="background:#111" onclick="setTheme('#ff3b30','اسود',this)"></div><div class="dot" style="background:#d9c7a7" onclick="setTheme('#c9a86a','بيج',this)"></div><div class="dot" style="background:#e6392e" onclick="setTheme('#e6392e','احمر',this)"></div><div class="dot" style="background:#1e5a3a" onclick="setTheme('#1e5a3a','اخضر',this)"></div><div class="dot" style="background:#2b4d8f" onclick="setTheme('#2b4d8f','ازرق',this)"></div></div><div style="font-size:13px;color:#ccc;margin-bottom:16px">اللون المختار: <b id="curColor">اسود</b></div><button class="btn" onclick="document.getElementById('prods').scrollIntoView({behavior:'smooth'})">تسوق الان ↓</button></div>
<div class="wrap"><div class="feat"><div><b>❄️</b><br>شتوي<br><span style="color:#888">هوديز تقيلة</span></div><div><b>💯</b><br>قطن 100%<br><span style="color:#888">جودة مضمونة</span></div><div><b>🚚</b><br>شحن سريع<br><span style="color:#888">كل المحافظات</span></div></div>
<h2 style="font-size:20px;margin:10px 0">🔥 المنتجات</h2><div class="searchRow"><input id="search" placeholder="🔍 ابحث..." oninput="render()"><select id="filterCat" onchange="render()" style="max-width:125px"><option value="">كل الأقسام</option><option>تيشيرت</option><option>هودي</option></select></div><div id="prods" class="grid"></div></div>
<div class="cartBar"><div><b>🛒 السلة:</b> <span id="cTotal">0</span> ج • <span id="cItems">0 منتج</span></div><button class="btn" style="padding:10px 16px" onclick="openCart()">اتمام الطلب →</button></div>
<div class="modal" id="cartModal"><div><h3 style="margin:0">اتمام الطلب 🛒</h3><div id="cartItems" style="margin:12px 0"></div><input id="custName" placeholder="الاسم بالكامل *"><input id="custPhone" placeholder="رقم الموبايل *"><input id="custAddr" placeholder="العنوان بالتفصيل *"><select id="custGov"><option>القاهرة</option><option>الجيزة</option><option>الاسكندرية</option><option>باقي المحافظات</option></select><select id="payMethod"><option value="COD">الدفع عند الاستلام</option><option value="Vodafone Cash">فودافون كاش</option></select><input id="coupon" placeholder="كود الخصم (جرب HARFAA10)"><div id="summary" style="background:#0f0f0f;padding:12px;border-radius:12px;margin:10px 0;font-size:14px;border:1px solid #222"></div><button class="btn" style="width:100%" onclick="placeOrder()">تأكيد الطلب على واتساب ✅</button><button class="btn2" onclick="closeCart()">اغلاق</button></div></div>
<script>
let cart=[];let sel={};
function setTheme(accent,name,el){document.documentElement.style.setProperty('--accent',accent);document.getElementById('curColor').textContent=name;document.getElementById('heroColor').textContent=name;document.querySelectorAll('#heroDots .dot').forEach(d=>d.classList.remove('active'));if(el)el.classList.add('active');}
function setProdColor(id,bg,accent,name,el){sel[id]=name;document.documentElement.style.setProperty('--accent',accent);document.getElementById('curColor').textContent=name;document.getElementById('heroColor').textContent=name;let pv=document.getElementById('pv-'+id);if(pv)pv.style.background=bg;let lbl=document.getElementById('lbl-'+id);if(lbl)lbl.textContent=name;let p=el.parentElement;p.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));el.classList.add('active');}
function makeSnow(){let box=document.getElementById('snowBox');for(let i=0;i<18;i++){let s=document.createElement('div');s.className='snow';s.textContent='❄';s.style.left=Math.random()*100+'vw';s.style.fontSize=(9+Math.random()*9)+'px';s.style.animationDuration=(7+Math.random()*7)+'s';s.style.animationDelay=(Math.random()*5)+'s';box.appendChild(s);}}
function getDB(){let d=JSON.parse(localStorage.getItem('harfaa_db')||'null');if(!d){d={products:[{id:1,name:'تيشيرت Harfaa',price:350,color:'اسود',cat:'تيشيرت',stock:5,desc:'قطن 100% - مريح'},{id:2,name:'هودي Harfaa',price:650,color:'بيج',cat:'هودي',stock:12,desc:'هودي شتوي تقيل'}],orders:[],coupons:[{code:'HARFAA10',val:10,type:'percent',min:0,active:true,used:0}],settings:{whats:'201000000000',cash:'01000000000',shipCairo:60,shipOther:90},editor:{}};localStorage.setItem('harfaa_db',JSON.stringify(d));}return d;}
function render(){let db=getDB();let q=document.getElementById('search').value.toLowerCase();let cat=document.getElementById('filterCat').value;let list=db.products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!cat||p.cat===cat));document.getElementById('prods').innerHTML=list.map(p=>{let cols=[{n:'اسود',bg:'#1a1a1a',a:'#ff3b30',e:'👕'},{n:'بيج',bg:'#d9c7a7',a:'#c9a86a',e:'👕'},{n:'احمر',bg:'#e6392e',a:'#e6392e',e:'👕'},{n:'اخضر',bg:'#1e5a3a',a:'#1e5a3a',e:'👕'},{n:'ازرق',bg:'#2b4d8f',a:'#2b4d8f',e:'👕'}];let cur=sel[p.id]||p.color;let curObj=cols.find(c=>c.n===cur)||cols[0];return `<div class="card"><div id="pv-${p.id}" class="preview" style="background:${curObj.bg}">${p.cat==='هودي'?'🧥':'👕'}</div><div class="cardBody"><b>${p.name}</b><div class="meta">${p.cat} • ${p.desc}</div><div class="lbl">اختار اللون: <b id="lbl-${p.id}">${cur}</b></div><div class="dots">${cols.map(c=>`<div class="dot ${c.n===cur?'active':''}" style="background:${c.bg}" onclick="setProdColor(${p.id},'${c.bg}','${c.a}','${c.n}',this)"></div>`).join('')}</div><div class="priceRow"><span class="price">${p.price} <small>ج</small></span><span class="stock">${p.stock<=0?'❌ نفذ':p.stock<10?'⚠️ باقي '+p.stock:'✅ متوفر'}</span></div><button class="addBtn" onclick="addToCart(${p.id})" ${p.stock<=0?'disabled':''}>+ اضف للسلة</button></div></div>`}).join('')||'<p>لا يوجد منتجات</p>';updateCartUI();}
function addToCart(id){let db=getDB();let p=db.products.find(x=>x.id==id);if(!p)return;let col=sel[id]||p.color;let ex=cart.find(x=>x.id==id&&x.col===col);if(ex)ex.qty++;else cart.push({id:p.id,name:p.name+' - '+col,price:p.price,qty:1,col:col});updateCartUI();}
function updateCartUI(){document.getElementById('cCount').textContent=cart.reduce((s,i)=>s+i.qty,0);document.getElementById('cTotal').textContent=cart.reduce((s,i)=>s+i.price*i.qty,0);document.getElementById('cItems').textContent=cart.length+' منتج';}
function openCart(){if(cart.length===0)return alert('السلة فاضية');document.getElementById('cartModal').style.display='flex';let db=getDB();let sub=cart.reduce((s,i)=>s+i.price*i.qty,0);let gov=document.getElementById('custGov').value;let ship=gov==='القاهرة'?db.settings.shipCairo:db.settings.shipOther;let disc=0;let code=document.getElementById('coupon').value.trim().toUpperCase();let cp=db.coupons.find(c=>c.code===code&&c.active);if(cp){disc=cp.type==='percent'?Math.round(sub*cp.val/100):cp.val;}document.getElementById('cartItems').innerHTML=cart.map(i=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222">${i.name} x ${i.qty} <b>${i.price*i.qty} ج</b></div>`).join('');document.getElementById('summary').innerHTML=`المجموع: ${sub} ج<br>الشحن: ${ship} ج<br>الخصم: -${disc} ج<br><b>الاجمالي: ${sub+ship-disc} ج</b>`;}
function closeCart(){document.getElementById('cartModal').style.display='none';}
function placeOrder(){let name=document.getElementById('custName').value.trim();let phone=document.getElementById('custPhone').value.trim();let addr=document.getElementById('custAddr').value.trim();if(!name||!phone||!addr)return alert('كمل بياناتك');if(cart.length===0)return alert('السلة فاضية');let db=getDB();let sub=cart.reduce((s,i)=>s+i.price*i.qty,0);let gov=document.getElementById('custGov').value;let ship=gov==='القاهرة'?db.settings.shipCairo:db.settings.shipOther;let disc=0;let code=document.getElementById('coupon').value.trim().toUpperCase();let cp=db.coupons.find(c=>c.code===code&&c.active);if(cp){disc=cp.type==='percent'?Math.round(sub*cp.val/100):cp.val;cp.used++;}let total=sub+ship-disc;let itemsText=cart.map(i=>i.name+' x'+i.qty).join(' - ');let order={id:'H-'+Math.floor(1000+Math.random()*9000),name:name,phone:phone,addr:addr+' - '+gov,total:total,status:'New',items:itemsText,pay:document.getElementById('payMethod').value,date:new Date().toLocaleDateString('ar-EG')};db.orders.push(order);cart.forEach(ci=>{let p=db.products.find(x=>x.id==ci.id);if(p)p.stock=Math.max(0,p.stock-ci.qty);});localStorage.setItem('harfaa_db',JSON.stringify(db));let msg=`طلب جديد Harfaa 🔥\nرقم: ${order.id}\nالاسم: ${name}\nالموبايل: ${phone}\nالعنوان: ${addr} - ${gov}\nالمنتجات: ${itemsText}\nالاجمالي: ${total} ج`;window.open('https://wa.me/'+db.settings.whats+'?text='+encodeURIComponent(msg));alert('تم ✅ رقم طلبك '+order.id);cart=[];updateCartUI();closeCart();render();}
makeSnow();render();
</script></body></html>
